# 非 root（uid 101）で 80 番を待ち受ける。Pod 側で net.ipv4.ip_unprivileged_port_start=0 を設定している。
server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
