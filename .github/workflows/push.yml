# GitHub Actions workflow for blog
# GitHub-hosted runner + Tailscale OIDC - latest運用

name: Build and Push to Harbor - blog

on:
  # 手動実行はテストとビルドのみ。公開は main への push で実行する。
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: build-push-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  publish:
    uses: home-lab-ksera/home-lab-k8s/.github/workflows/publish-harbor.yml@main
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      image_name: blog
